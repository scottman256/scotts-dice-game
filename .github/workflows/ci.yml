name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend and backend changes
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed() {
            local result
            set +e
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$@"
            result=$?
            set -e

            case "$result" in
              0) echo false ;;
              1) echo true ;;
              *) return "$result" ;;
            esac
          }

          frontend_changed="$(changed frontend/ .github/workflows/ci.yml)"
          backend_changed="$(changed backend/ .github/workflows/ci.yml)"

          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "Frontend changed: $frontend_changed"
          echo "Backend changed: $backend_changed"

  frontend:
    name: Frontend tests and coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and enforce coverage
        run: npm run test:ci -- --runInBand

      - name: Build production frontend
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend tests and coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit and integration tests with coverage
        run: ./gradlew check --no-daemon

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 7
